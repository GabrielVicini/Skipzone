name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A new push to a PR cancels its older run. Runs on master always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Pinned so a new stable release cannot add lints without a change here.
  RUST_TOOLCHAIN: "1.97"
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
      # eframe and winit need X11 and Wayland headers on Linux.
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libx11-dev libgl1-mesa-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libx11-dev libgl1-mesa-dev
      - run: cargo test --workspace --all-targets
      # Building the engine on its own proves it needs nothing from the app's
      # dependency tree. A workspace build would hide a leak.
      - name: Engine builds standalone
        run: cargo build -p skipzone --lib

  msrv:
    name: engine-side crates on their declared rust-version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv
      # Each engine-side crate is checked on the rust-version it declares:
      # 1.85 for the engine, 1.88 for iono and predict. The app and lab
      # follow eframe's own minimum.
      - name: cargo check engine-side crates
        run: |
          meta=$(cargo metadata --no-deps --format-version 1)
          for crate in skipzone skipzone-iono skipzone-predict; do
            ver=$(jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .rust_version // "none"' <<<"$meta")
            if [ -z "$ver" ]; then
              echo "$crate: not present, skipped"
              continue
            fi
            if [ "$ver" = "none" ]; then
              echo "::error::$crate has no rust-version in its Cargo.toml"
              exit 1
            fi
            rustup toolchain install "$ver" --profile minimal --no-self-update
            echo "::group::cargo +$ver check -p $crate"
            cargo "+$ver" check -p "$crate" --all-features
            echo "::endgroup::"
          done

  docs:
    name: rustdoc
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: docs
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libx11-dev libgl1-mesa-dev
      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

  boundaries:
    name: crate boundaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      # Uses cargo metadata only, so nothing is compiled.
      - run: python3 scripts/check-boundaries.py

  deny:
    name: cargo deny (${{ matrix.checks }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        checks:
          - advisories
          - bans licenses sources
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}
          arguments: --workspace --all-features
