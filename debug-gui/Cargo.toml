[package]
name = "skipzone-debug-gui"
version = "0.1.0"
edition = "2024"
description = "Interactive point-to-point debug harness for the Skipzone ray tracing engine"
publish = false

[dependencies]
skipzone = { path = ".." }
eframe = "0.35"
egui = "0.35"
walkers = "0.56"

# Deliberately NOT clippy-pedantic, unlike the engine crate: this is a
