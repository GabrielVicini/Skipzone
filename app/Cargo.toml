[package]
name = "skipzone-app"
license = "MIT"
version = "0.1.0"
edition = "2024"
description = "Interactive point-to-point HF ray tracing application for the Skipzone engine"
publish = false

[[bin]]
name = "skipzone-app-bin"
path = "src/main.rs"

[dependencies]
skipzone = { path = ".." }
eframe = "0.35"
egui = "0.35"
# Complex Fresnel reflection coefficients for the ground-reflection loss term.
num-complex = "0.4"
# Data-parallel execution for the compute layer (frequency sweep and any other
# embarrassingly-parallel batch of independent engine solves). All parallelism
# in the project lives in this layer; see `compute.rs`.
rayon = "1"
shapefile = { version = "0.9.0", default-features = false }
# HTTPS for the validation harness only: it fetches live WSPR spots and the
# current solar indices. The GUI and solver never touch the network, and the
# workspace split keeps this dependency out of the engine crate. Pure-Rust TLS
# avoids a system library.
ureq = { version = "3", default-features = false, features = ["rustls"] }

# Not clippy-pedantic, unlike the engine crate: pedantic lints on egui layout
# code add churn without catching bugs.
