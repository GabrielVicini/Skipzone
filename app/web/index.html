<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Skipzone - point-to-point HF ray tracing</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #0b0d1a;
      font-family: system-ui, sans-serif;
      color: #c8ccd8;
    }

    /* eframe sizes the canvas to its parent, so the parent is what must fill
       the window. */
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>

<body>
  <div id="loading">Loading Skipzone...</div>
  <canvas id="skipzone_canvas"></canvas>

  <script type="module">
    import init, { start } from './skipzone_app.js';

    init()
      .then(() => {
        document.getElementById('loading').remove();
        start();
      })
      .catch((err) => {
        document.getElementById('loading').textContent =
          'Failed to load: ' + err;
        console.error(err);
      });
  </script>
</body>

</html>
