[package]
name = "skipzone-app"
version = "0.1.0"
edition = "2024"
description = "Interactive point-to-point HF ray tracing application for the Skipzone engine"
publish = false

[[bin]]
name = "skipzone-app-bin"
path = "src/main.rs"

[dependencies]
skipzone = { path = ".." }
eframe = "0.35"
egui = "0.35"
walkers = "0.56"
# Complex Fresnel reflection coefficients for the ground-reflection loss term.
num-complex = "0.4"
# Data-parallel execution for the compute layer (frequency sweep and any other
# embarrassingly-parallel batch of independent engine solves). All parallelism
# in the project lives in this layer; see `compute.rs`.
rayon = "1"
shapefile = { version = "0.9.0", default-features = false }
# HTTPS for the validation harness only: it fetches live WSPR spots and the
# current solar indices. Nothing in the GUI or the solver touches the network,
# and the engine crate never sees this - the workspace split exists so that an
# HTTP dependency here cannot reach it. Pure-Rust TLS so there is no system
# library to install, matching the crate's portability requirement.
ureq = { version = "3", default-features = false, features = ["rustls"] }

# Deliberately NOT clippy-pedantic, unlike the engine crate: this is an
# egui application crate, and pedantic lint churn on UI layout code buys
# nothing. The engine keeps its strict lints.
