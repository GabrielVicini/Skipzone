[package]
name = "skipzone-app"
version = "0.1.0"
edition = "2024"
description = "Interactive point-to-point HF ray tracing application for the Skipzone engine"
publish = false

[dependencies]
skipzone = { path = ".." }
eframe = "0.35"
egui = "0.35"
walkers = "0.56"
# Complex Fresnel reflection coefficients for the ground-reflection loss term.
num-complex = "0.4"
# Data-parallel execution for the compute layer (frequency sweep and any other
# embarrassingly-parallel batch of independent engine solves). The engine crate
# stays single-threaded; parallelism lives entirely in this app layer.
rayon = "1"
shapefile = { version = "0.9.0", default-features = false }

# Deliberately NOT clippy-pedantic, unlike the engine crate: this is an
# egui application crate, and pedantic lint churn on UI layout code buys
# nothing. The engine keeps its strict lints.
