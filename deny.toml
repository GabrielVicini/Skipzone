# cargo-deny configuration. Run with `cargo deny --workspace check`;
# without --workspace only the root package is checked.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Each ignore is a GUI-stack crate with no fixed release reachable from
# eframe 0.35. Revisit when eframe updates (Dependabot opens the PR).
ignore = [
    # quick-xml 0.38/0.39, via wayland-scanner (build-time, parses the bundled
    # Wayland protocol files) and zbus_xml (local D-Bus introspection data).
    # Neither parses input from the network. Fixed in 0.41.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml via winit/accesskit; no untrusted XML parsed" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml via winit/accesskit; no untrusted XML parsed" },
    # Unmaintained, pulled in by winit (window decorations) and accesskit (Linux a11y).
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser via winit; unmaintained, no known vulnerability" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant via accesskit; unmaintained, no known vulnerability" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names via accesskit; unmaintained, no known vulnerability" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via accesskit; unmaintained, no known vulnerability" },
]

[licenses]
version = 2
# Licences compatible with shipping the project under MIT.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# Allowed for one crate each, on top of the list above.
exceptions = [
    # Bundled egui fonts (Hack and Ubuntu), distributed unmodified.
    { crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
    # NeQuick reference data compiled in from crates/skipzone-iono/data/nequick/.
    { crate = "skipzone-iono", allow = ["EUPL-1.2"] },
]

[licenses.private]
# Workspace crates are checked like any other dependency.
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
