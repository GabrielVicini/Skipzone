[package]
name = "skipzone-app"
license = "MIT"
version = "0.1.0"
edition = "2024"
description = "Interactive point-to-point HF ray tracing application for the Skipzone engine"
publish = false

[[bin]]
name = "skipzone-app-bin"
path = "src/main.rs"

[dependencies]
skipzone-iono = { path = "../crates/skipzone-iono" }
skipzone-predict = { path = "../crates/skipzone-predict", features = ["serde"] }
# `persistence` gives App::save and the storage handed to SkipzoneApp::new.
eframe = { version = "0.36", features = ["persistence"] }
egui = "0.36"
# The saved settings, as RON in eframe's storage (see persist.rs).
ron = "0.12"
serde = { version = "1", features = ["derive"] }

# Not clippy-pedantic, unlike the engine crate: pedantic lints on egui layout
# code add churn without catching bugs.

[features]
# Image snapshot tests in tests/snapshots.rs. They render with wgpu, so they
# need a GPU or a software Vulkan driver such as Mesa lavapipe. Off by default:
# the normal test run stays renderer-free.
snapshots = ["egui_kittest/snapshot", "egui_kittest/wgpu"]

[dev-dependencies]
# Headless UI tests. The snapshot and wgpu features come only with the
# `snapshots` feature above.
egui_kittest = { version = "=0.36.2", features = ["eframe"] }

[[test]]
name = "snapshots"
required-features = ["snapshots"]
