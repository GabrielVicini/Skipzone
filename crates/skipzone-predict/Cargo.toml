[package]
name = "skipzone-predict"
license = "MIT"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Headless HF link prediction on the Skipzone engine: scenarios, solve, link budget, sweep, coverage"
publish = false

[lib]
name = "skipzone_predict"

[dependencies]
skipzone = { path = "../skipzone" }
skipzone-iono = { path = "../skipzone-iono" }
# Complex Fresnel reflection coefficients for the ground-reflection loss term.
num-complex = "0.4"
# Data-parallel execution for the compute layer (frequency sweep and any other
# embarrassingly-parallel batch of independent engine solves). All parallelism
# in the project lives in this crate; see `compute.rs`.
rayon = "1"
shapefile = { version = "0.9.0", default-features = false }
# Only for the app's saved settings. Off by default.
serde = { version = "1", features = ["derive"], optional = true }

[features]
# Serialize and Deserialize on the setting types the app saves: the ground,
# noise, mode and antenna choices and the coverage grid.
serde = ["dep:serde", "skipzone-iono/serde"]
