# Full validation on all three OSes and both architectures (spec:
# portability). Tests run in release: the quadrature-heavy validation
# suites are numerical and their assertions are optimization-independent
# (any release/debug result difference would itself be a bug worth failing
# on, so debug tests run on one platform as a cross-check).
name: ci
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x86-64 }
          - { os: ubuntu-24.04-arm, arch: aarch64 }
          - { os: macos-13, arch: x86-64 }
          - { os: macos-latest, arch: aarch64 }
          - { os: windows-latest, arch: x86-64 }
          - { os: windows-11-arm, arch: aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --check
      - name: Clippy (pedantic, deny)
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests (release)
        run: cargo test --release
      - name: Tests (debug, one platform sanity)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test
